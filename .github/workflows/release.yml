# Builds Grabber-Setup.exe from the tagged source on GitHub's servers and publishes it as a release,
# with a SHA-256 checksum and a signed build-provenance attestation, so anyone can verify that the
# installer was built from this repository and not swapped afterwards.
#
#   git tag v2.0.0 && git push origin v2.0.0
#
# Third-party actions are pinned to commit SHAs (a tag can be moved, a SHA can't).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # create the release
  id-token: write      # sign the provenance attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Check that the tag matches manifest.json
        shell: pwsh
        run: |
          $v = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != manifest version v$v" }

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.3
          choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./src/build.ps1 -SkipRender

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/Grabber-Setup.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/Grabber-Setup.exe dist/SHA256SUMS.txt `
            --title "Grabber ${{ github.ref_name }}" --generate-notes
