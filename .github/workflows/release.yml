# Builds Grabber-Setup.exe (Windows) and Grabber-macOS.tar.gz (macOS) from the tagged source on GitHub's
# servers and publishes them as a release, with SHA-256 checksums and a signed build-provenance
# attestation, so anyone can verify that the files were built from this repository and not swapped afterwards.
#
#   git tag v2.0.0 && git push origin v2.0.0
#
# Third-party actions are pinned to commit SHAs (a tag can be moved, a SHA can't).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that the tag matches manifest.json
        run: |
          v="v$(jq -r .version extension/manifest.json)"
          [ "$v" = "${{ github.ref_name }}" ] || { echo "Tag ${{ github.ref_name }} != manifest version $v"; exit 1; }

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.3
          choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./src/build.ps1 -SkipRender

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/Grabber-Setup.exe
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # python.org's installer: a universal2 Python, so one helper runs on Apple Silicon and Intel.
      - name: Install build tools
        run: |
          curl -fsSL -o python.pkg https://www.python.org/ftp/python/3.13.17/python-3.13.17-macos11.pkg
          sudo installer -pkg python.pkg -target /
          rm python.pkg
          /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 -m pip install pyinstaller==6.22.3

      - name: Build package
        run: PYTHON=/Library/Frameworks/Python.framework/Versions/3.13/bin/python3 bash src/build-mac.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/Grabber-macOS.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum Grabber-Setup.exe Grabber-macOS.tar.gz | tee SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Grabber-Setup.exe
            dist/Grabber-macOS.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            dist/Grabber-Setup.exe dist/Grabber-macOS.tar.gz dist/SHA256SUMS.txt \
            --title "Grabber ${{ github.ref_name }}" --generate-notes
