<!doctype html>
<!-- Download buttons for the README (docs/btn-windows.png, docs/btn-macos.png), rendered by render.ps1:
     buttons.html?os=win | ?os=mac, window 340x80, scale 2, transparent background.
     Same look as the popup's "Скачать" button. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; font-weight: 500; src: url("../../extension/assets/fonts/Inter-Medium.woff") format("woff"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("../../extension/assets/fonts/Inter-Bold.woff") format("woff"); }
  html, body { margin: 0; background: transparent; }
  .btn {
    box-sizing: border-box; width: 340px; height: 80px; border-radius: 18px;
    display: flex; align-items: center; gap: 16px; padding: 0 26px;
    background: linear-gradient(180deg, #2F6BF0 0%, #1A56DB 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -2px 0 rgba(0,0,0,.10);
    color: #fff; font-family: Inter, sans-serif;
  }
  svg { width: 34px; height: 34px; flex: none; fill: #fff; }
  .t1 { white-space: nowrap; font-size: 21px; font-weight: 700; letter-spacing: -.2px; line-height: 1.2; }
  .t2 { font-size: 14px; font-weight: 500; opacity: .82; line-height: 1.35; }
</style>
</head>
<body>
<div class="btn" id="win">
  <svg viewBox="0 0 24 24"><path d="M0 3.45 9.75 2.1v9.45H0zm10.95-1.5L24 0v11.4H10.95zM0 12.6h9.75v9.45L0 20.7zm10.95 0H24V24l-13.05-1.8z"/></svg>
  <div><div class="t1">Скачать для Windows</div><div class="t2">Windows 10 / 11 · установщик</div></div>
</div>
<div class="btn" id="mac">
  <svg viewBox="0 0 24 24"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
  <div><div class="t1">Установить на Mac</div><div class="t2">M-чипы и Intel · одна команда</div></div>
</div>
<script>
  var os = new URLSearchParams(location.search).get('os') === 'mac' ? 'win' : 'mac';
  document.getElementById(os).style.display = 'none';
</script>
</body>
</html>
